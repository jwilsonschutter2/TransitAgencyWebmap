<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transit Agency GTFS Viewer</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h1>Transit Agency GTFS Viewer</h1>
    <p class="intro">Enter a Mapbox public token, then select an agency centroid to load its route geometry.</p>
    <label for="tokenInput">Mapbox public token</label>
    <div class="token-row">
      <input id="tokenInput" type="password" autocomplete="off" placeholder="pk.eyJ1...">
      <button id="toggleToken" class="secondary" type="button">Show</button>
    </div>
    <button id="loadMapBtn" type="button">Load map</button>
    <p class="privacy">The token is stored only in this browser's local storage.</p>
    <div id="status" role="status">Waiting for a Mapbox token.</div>
    <section id="legend" class="legend" hidden><h2>Route legend</h2><div id="legendItems"></div></section>
    <section id="agencyInfo" class="agency-card" hidden>
      <h2 id="agencyName"></h2>
      <p><strong>Routes:</strong> <span id="routeCount">0</span></p>
      <p><strong>Vertices:</strong> <span id="vertexCount">0</span></p>
      <p id="sourceFile"></p>
    </section>
  </aside>
  <main id="map" aria-label="Transit agency map"></main>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
