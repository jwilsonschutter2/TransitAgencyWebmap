<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transit Network Explorer</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
  <aside class="sidebar">
    <header class="brand"><span class="brand-mark">TN</span><div><h1>Transit Network Explorer</h1><p>GTFS networks and NTD analytics</p></div></header>
    <section class="panel" id="setupPanel">
      <label for="tokenInput">Mapbox public token</label>
      <div class="input-row"><input id="tokenInput" type="password" placeholder="pk.eyJ1…"><button id="toggleToken" class="button subtle">Show</button></div>
      <button id="loadMapBtn" class="button primary full">Load map</button>
    </section>
    <section class="panel"><label for="agencySearch">Find an agency</label><input id="agencySearch" type="search" placeholder="Agency, state, short ID, or NTD ID" disabled><div id="searchResults" class="search-results" hidden></div></section>
    <div id="status" class="status">Enter a Mapbox token to begin.</div>

    <section id="agencyPanel" hidden>
      <div class="agency-header"><div><span id="agencyModeBadge" class="badge">Transit</span><h2 id="agencyName"></h2><p id="agencyLocation"></p></div><button id="clearAgencyBtn" class="round-button" title="Return to national view">×</button></div>
      <div class="action-row"><button id="analyticsBtn" class="button primary">Agency analytics</button><button id="fitAgencyBtn" class="button subtle">Fit network</button></div>
      <nav class="tabs"><button class="tab active" data-tab="network">Network</button><button class="tab" data-tab="ntd">NTD data</button><button class="tab" data-tab="exports">Exports</button></nav>
      <div id="networkTab" class="tab-panel active">
        <div class="kpi-grid"><article><span>Routes</span><strong id="routeCount">0</strong></article><article><span>Stops</span><strong id="stopCount">0</strong></article><article><span>Trips</span><strong id="tripCount">0</strong></article><article><span>Shapes</span><strong id="shapeCount">0</strong></article></div>
        <div class="toggle-row"><label><input id="routesToggle" type="checkbox" checked> Routes</label><label><input id="stopsToggle" type="checkbox" checked> Stops</label><label><input id="labelsToggle" type="checkbox" checked> Labels</label></div>
        <div id="modeLegend" class="chip-list"></div>
        <details><summary>Route directory</summary><div id="routeLegend" class="route-list"></div></details>
      </div>
      <div id="ntdTab" class="tab-panel"><div id="ntdSummary" class="data-list"></div></div>
      <div id="exportsTab" class="tab-panel"><button id="exportRoutesBtn" class="button export full">Routes GeoJSON</button><button id="exportStopsBtn" class="button export full">Stops GeoJSON</button><button id="exportMetadataBtn" class="button export full">Agency metadata</button><button id="exportPackageBtn" class="button primary full">Combined package</button></div>
    </section>
  </aside>

  <main id="map"></main>
  <div id="loadingOverlay" class="loading" hidden><span class="spinner"></span>Loading network…</div>

  <aside id="featureDrawer" class="drawer" hidden>
    <button id="closeDrawerBtn" class="round-button close">×</button>
    <span id="featureType" class="badge"></span><h2 id="featureTitle"></h2><p id="featureSubtitle" class="muted"></p>
    <div id="featureDetails" class="data-list"></div>
    <h3>Agency NTD context</h3><div id="featureNtd" class="data-list"></div>
  </aside>

  <div id="analyticsModal" class="modal-shell" hidden>
    <section class="modal-card"><header><div><span class="badge">Agency dashboard</span><h2 id="analyticsTitle"></h2></div><button id="closeAnalyticsBtn" class="round-button">×</button></header><div id="analyticsContent" class="analytics-content"></div></section>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
